name: Review gate

# The review process (website/docs/contributing/reviewing.md): every pull request gets a
# risk tier from the files it changes, and may not merge before the maintainer sets the
# labels that tier needs. Runs again whenever a label, the base or the code changes.
#
# pull_request_target runs this file and scripts/review-gate.mjs as they are on the base
# branch, so a pull request (a fork's too) cannot change the rules it is judged by. It never
# checks out or runs the pull request's code: it reads the file list and labels from the API.
# Its run belongs to the base commit, so the verdict is posted as the commit status
# "review-gate" on the pull request's head, which is what the ruleset requires.
"on":
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Not named review-gate: this run's own check lands on the base commit, which in a stack is
  # the parent pull request's head, and must not pass for it.
  classify:
    name: review-gate (classify)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Decide tier and required labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const { decide } = await import(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/review-gate.mjs')
            );
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const post = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha, state, context: 'review-gate',
                description: description.slice(0, 140), target_url: runUrl,
              });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            // The API lists at most 3000 files; past that a high-risk file could be missed.
            if (files.length >= 3000) {
              await post('failure', 'Too many files to classify: split the pull request.');
              return;
            }
            const names = files.flatMap(file =>
              file.previous_filename ? [file.filename, file.previous_filename] : [file.filename],
            );
            // Read now, not from the event: the payload is a snapshot from when it fired.
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const labels = current.map(label => label.name);
            const result = decide(names, labels, { author: pr.user.login });

            if (!labels.includes(result.riskLabel)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [result.riskLabel],
              });
            }
            for (const name of result.staleRiskLabels) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
            }

            await core.summary
              .addHeading(`Risk tier: ${result.tier}`, 3)
              .addList([
                `Areas: ${result.areas.join(', ') || 'none'}`,
                `App code: ${result.code ? 'yes' : 'no'}, UI: ${result.ui ? 'yes' : 'no'}`,
                `Labels needed: ${result.required.join(', ') || 'none'}`,
                `Missing: ${result.missing.join(', ') || 'none'}`,
              ])
              .write();

            if (result.missing.length) {
              const message = `${result.tier}: waiting for ${result.missing.join(', ')}`;
              await post('failure', message);
              core.notice(message);
            } else {
              await post('success', `${result.tier}: every label it needs is set`);
            }

  # The check the merge queue needs on its own commit: labels were checked on each pull
  # request (the review-gate commit status) before it could join the queue.
  review-gate:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Merge queue
        run: echo "Labels were checked on each pull request before it joined the queue."
